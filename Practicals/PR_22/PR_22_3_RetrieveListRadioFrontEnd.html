<!DOCTYPE html>
<html>
	<head>
		<title>List and Radio Button Form</title>
	</head>
	<body>
		<form action="./RetrieveListRadio" method="POST">
			<label for="list">Select an item from the list:</label>
			<select name="list" id="list">
				<option value="item1">Item 1</option>
				<option value="item2">Item 2</option>
				<option value="item3">Item 3</option>
			</select>
			<br>
			<label>Choose a radio button:</label>
			<input type="radio" name="radiobtn" value="radio1"> Radio 1
			<input type="radio" name="radiobtn" value="radio2"> Radio 2
			<input type="radio" name="radiobtn" value="radio3"> Radio 3
			<br>
			<input type="submit" value="Submit">
		</form>
	</body>
</html>
